<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daylight | Calendar Assistant</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 2rem 1rem;
                background: #f3f6fa;
                color: #263449;
            }
            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                border: 1px solid #dce3ed;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 12px 36px #243b3212;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 65vh;
            }
            #toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.75rem 1.5rem;
                border-bottom: 1px solid #e5eaf1;
            }
            #toolbar strong {
                color: #285da8;
                font-size: 1.1rem;
            }
            #intro {
                padding: 1.25rem 1.5rem 0;
            }
            #intro h1 {
                margin-bottom: 0.4rem;
                font-size: 1.35rem;
                font-weight: 600;
            }
            #intro p {
                color: #64748b;
                font-size: 0.9rem;
                line-height: 1.5;
            }
            #capabilities {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                padding: 1rem 1.5rem 0;
            }
            #capabilities span {
                padding: 0.4rem 0.65rem;
                border: 1px solid #dbe5f2;
                border-radius: 4px;
                background: #f5f8fc;
                color: #435975;
                font-size: 0.8rem;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.assistant {
                max-width: 90%;
            }
            .msg .content p + p {
                margin-top: 0.65rem;
            }
            .msg .content ul,
            .msg .content ol {
                margin: 0.4rem 0 0.4rem 1.25rem;
            }
            .msg .content li + li {
                margin-top: 0.25rem;
            }
            .tool {
                max-width: 100%;
                border-radius: 4px;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e5eaf1;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #cbd5e1;
                font-size: 1rem;
                outline: none;
                color: #263449;
            }
            #user-input:focus {
                border-bottom-color: #3976c5;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #3976c5;
                color: #fff;
                border: none;
                border-radius: 4px;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            button:hover:not(:disabled) {
                background: #2d63a7;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f1f5fb;
                border-left: 3px solid #6c91c4;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #3b68a2;
            }
            button:disabled {
                opacity: 0.3;
            }
            @media (max-width: 600px) {
                #messages {
                    min-height: 360px;
                    padding: 1.25rem;
                }
                #input-area {
                    gap: 0.75rem;
                    padding: 1rem;
                }
                #input-area button {
                    padding: 0.75rem 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="toolbar">
                <strong>Daylight</strong>
                <button id="connect-btn">Connect Google to sync Calendar & Gmail</button>
            </div>
            <div id="intro">
                <h1>Hi, I'm Daylight.</h1>
                <p>Your calendar planning assistant. I can check your schedule, look through Gmail for event details, and help spot conflicts.</p>
            </div>
            <div id="capabilities" aria-label="What Daylight can help with">
                <span>Check your schedule</span>
                <span>Find event details in Gmail</span>
                <span>Spot calendar conflicts</span>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about your calendar..."
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const connectBtn = document.getElementById("connect-btn");
            let sessionId = null;

            connectBtn.addEventListener("click", function () {
                window.open("/auth/google", "daylight-google-auth", "popup,width=520,height=680");
            });

            window.addEventListener("message", function (event) {
                if (event.origin === window.location.origin && event.data === "daylight-google-connected") {
                    connectBtn.textContent = "Google connected";
                }
            });

            fetch("/auth/status")
                .then((response) => response.json())
                .then((data) => {
                    if (data.connected) connectBtn.textContent = "Google connected";
                });

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML = '<div class="role">' + role + '</div><div class="content"></div>';
                div.querySelector(".content").textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            function renderMarkdown(text) {
                const escapeHtml = (value) =>
                    value.replace(/[&<>"']/g, (char) => ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;",
                    })[char]);
                const inline = (value) =>
                    escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
                const blocks = text.trim().split(/\n\s*\n/);
                return blocks.map((block) => {
                    const lines = block.split("\n");
                    if (lines.every((line) => /^\s*[-*]\s+/.test(line))) {
                        return "<ul>" + lines.map((line) => "<li>" + inline(line.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
                    }
                    if (lines.every((line) => /^\s*\d+[.)]\s+/.test(line))) {
                        return "<ol>" + lines.map((line) => "<li>" + inline(line.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
                    }
                    return "<p>" + lines.map(inline).join("<br>") + "</p>";
                }).join("");
            }

            function formatToolResult(result) {
                try {
                    const data = typeof result === "string" ? JSON.parse(result) : result;
                    if (data.error) return data.error;
                    if (Array.isArray(data.events)) {
                        if (!data.events.length) return "No calendar events found.";
                        return data.events.map((event) =>
                            `${event.summary}: ${event.start || "all day"}${event.end ? " to " + event.end : ""}`
                        ).join("\n");
                    }
                    if (Array.isArray(data.messages)) {
                        if (!data.messages.length) return "No matching emails found.";
                        return data.messages.map((email) =>
                            `${email.subject || "(No subject)"} | ${email.date || ""}\n${email.snippet || ""}`
                        ).join("\n\n");
                    }
                    return JSON.stringify(data, null, 2);
                } catch {
                    return String(result);
                }
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n" + formatToolResult(call.result),
                            ),
                        );
                        messages.insertBefore(div, loading);
                    }
                    loading.querySelector(".content").innerHTML = renderMarkdown(data.response);
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
