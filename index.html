<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daylight | Calendar Assistant</title>
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                font-family: system-ui, sans-serif;
                color: #243344;
                background: #eaf0ef;
            }
            button, input { font: inherit; }
            button { cursor: pointer; }
            #app {
                width: min(1240px, 100%);
                height: calc(100dvh - 40px);
                min-height: 560px;
                margin: auto;
                display: grid;
                grid-template-columns: 270px minmax(0, 1fr);
                overflow: hidden;
                border: 1px solid #cddbdc;
                border-radius: 8px;
                background: #fff;
                box-shadow: 0 18px 50px #263b4118;
            }
            #sidebar {
                min-width: 0;
                display: flex;
                flex-direction: column;
                padding: 28px 20px 22px;
                background: #f0f5f2;
                border-right: 1px solid #dce6e2;
            }
            .brand { display: flex; align-items: center; gap: 10px; }
            .brand-icon {
                width: 36px;
                height: 36px;
                display: grid;
                place-items: center;
                border-radius: 6px;
                color: #fff;
                background: #246bd3;
                font-size: 1.3rem;
            }
            .brand-name { font-size: 1.25rem; font-weight: 700; }
            .eyebrow {
                display: block;
                color: #667b78;
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            .sidebar-date {
                padding: 30px 0 26px;
                border-bottom: 1px solid #d6e1dc;
            }
            #today-date { display: block; margin-top: 7px; font-size: 1.1rem; font-weight: 600; }
            .quick-section { padding-top: 28px; }
            .quick-section .eyebrow { margin-bottom: 12px; }
            .quick-prompt {
                width: 100%;
                display: block;
                padding: 11px 10px;
                margin-bottom: 6px;
                border: 0;
                border-radius: 4px;
                background: transparent;
                color: #2d4650;
                text-align: left;
                line-height: 1.4;
            }
            .quick-prompt:hover, .quick-prompt:focus-visible { background: #e0ebe7; outline: none; }
            .quick-prompt::before { content: "↗"; margin-right: 9px; color: #d16e45; }
            .connection { margin-top: auto; padding-top: 22px; border-top: 1px solid #d6e1dc; }
            .connection p { margin: 8px 0 0; color: #657875; font-size: 0.78rem; line-height: 1.4; }
            #connect-btn {
                width: 100%;
                padding: 11px 13px;
                border: 1px solid #286bd0;
                border-radius: 4px;
                background: #286bd0;
                color: #fff;
                text-align: center;
                font-size: 0.85rem;
                font-weight: 600;
            }
            #connect-btn:hover { background: #1e5ab3; }
            #connect-btn.connected { background: #e4f1e9; border-color: #a9d4b8; color: #28654a; }
            #workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
            #toolbar { padding: 24px 32px 20px; border-bottom: 1px solid #e3e9ea; }
            #toolbar h1 { margin: 5px 0 0; font-size: 1.35rem; line-height: 1.25; }
            #messages {
                min-height: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 20px;
                padding: 28px 32px;
                overflow-y: auto;
            }
            #empty-state { margin: auto 0; max-width: 540px; }
            #empty-state[hidden] { display: none; }
            #empty-state h2 { margin: 9px 0; font-size: 1.75rem; line-height: 1.25; }
            #empty-state p { margin: 0; color: #687b85; line-height: 1.5; }
            .msg { max-width: min(720px, 90%); line-height: 1.55; overflow-wrap: anywhere; }
            .msg.user {
                align-self: flex-end;
                max-width: min(600px, 85%);
                padding: 12px 16px;
                border-radius: 6px;
                background: #eaf2ff;
            }
            .msg .role {
                margin-bottom: 5px;
                color: #6e828d;
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.07em;
                text-transform: uppercase;
            }
            .msg.user .role { color: #3b6eb4; }
            .msg.loading .content { color: #78909a; }
            .msg .content p { margin: 0; }
            .msg .content p + p { margin-top: 0.7rem; }
            .msg .content ul, .msg .content ol { margin: 0.4rem 0 0.4rem 1.2rem; padding: 0; }
            .tool {
                max-width: min(720px, 100%);
                border-left: 3px solid #5d87c4;
                border-radius: 3px;
                background: #f3f7fb;
                color: #476178;
                font-size: 0.78rem;
            }
            .tool summary { padding: 10px 13px; cursor: pointer; overflow-wrap: anywhere; }
            .tool summary strong { color: #2c5f9f; }
            .tool pre {
                margin: 0;
                padding: 0 13px 12px;
                font: 0.75rem/1.5 ui-monospace, monospace;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            #input-area {
                display: flex;
                gap: 12px;
                padding: 19px 32px 24px;
                border-top: 1px solid #e3e9ea;
                background: #fff;
            }
            #user-input {
                min-width: 0;
                flex: 1;
                padding: 13px 14px;
                border: 1px solid #cddbdc;
                border-radius: 4px;
                color: #243344;
                background: #f8faf9;
                outline: none;
            }
            #user-input:focus { border-color: #286bd0; box-shadow: 0 0 0 2px #286bd020; }
            #send-btn {
                min-width: 88px;
                padding: 12px 18px;
                border: 0;
                border-radius: 4px;
                color: #fff;
                background: #286bd0;
                font-weight: 600;
            }
            #send-btn:hover:not(:disabled) { background: #1e5ab3; }
            #send-btn:disabled { opacity: 0.55; cursor: default; }
            @media (max-width: 700px) {
                body { padding: 0; }
                #app { width: 100%; height: 100dvh; min-height: 0; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); border: 0; border-radius: 0; }
                #sidebar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; border-right: 0; border-bottom: 1px solid #dce6e2; }
                .brand-name { font-size: 1.05rem; }
                .brand-icon { width: 30px; height: 30px; font-size: 1.05rem; }
                .sidebar-date { padding: 0; border: 0; text-align: right; }
                #today-date { margin-top: 3px; font-size: 0.86rem; }
                .quick-section { grid-column: 1 / -1; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
                .quick-section .eyebrow { display: none; }
                .quick-prompt { min-width: 0; margin: 0; padding: 7px 8px; border: 1px solid #d6e1dc; font-size: 0.73rem; }
                .connection { grid-column: 1 / -1; margin: 0; padding: 0; border: 0; }
                #connect-btn { width: auto; padding: 7px 10px; font-size: 0.75rem; }
                .connection p { display: inline; margin-left: 8px; font-size: 0.72rem; }
                #toolbar { padding: 15px 18px; }
                #toolbar h1 { font-size: 1.15rem; }
                #messages { padding: 18px; gap: 16px; }
                #empty-state h2 { font-size: 1.4rem; }
                #input-area { padding: 12px 16px; gap: 8px; }
                #send-btn { min-width: 68px; padding: 10px; }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <aside id="sidebar">
                <div class="brand"><span class="brand-icon" aria-hidden="true">☀</span><span class="brand-name">Daylight</span></div>
                <div class="sidebar-date"><span class="eyebrow">Today in ET</span><span id="today-date"></span></div>
                <div class="quick-section" aria-label="Suggested questions">
                    <span class="eyebrow">Start with a question</span>
                    <button type="button" class="quick-prompt" data-prompt="What's on my schedule today?">Today's plans</button>
                    <button type="button" class="quick-prompt" data-prompt="When do I have two free hours this week?">Find free time</button>
                    <button type="button" class="quick-prompt" data-prompt="Check my email and calendar for upcoming events.">Upcoming events</button>
                </div>
                <div class="connection">
                    <button type="button" id="connect-btn">Connect Google</button>
                    <p id="connection-note">Sync Calendar + Gmail</p>
                </div>
            </aside>
            <main id="workspace">
                <header id="toolbar"><span class="eyebrow">Your planner</span><h1>Your week, in focus.</h1></header>
                <div id="messages" aria-live="polite">
                    <div id="empty-state">
                        <span class="eyebrow">Calendar + inbox</span>
                        <h2>Make room for what's next.</h2>
                        <p>Ask Daylight about your plans, open time, or an event you want to add.</p>
                    </div>
                </div>
                <form id="input-area">
                    <input type="text" id="user-input" placeholder="Ask Daylight about your schedule..." autocomplete="off" aria-label="Message Daylight" />
                    <button type="submit" id="send-btn">Send</button>
                </form>
            </main>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const connectBtn = document.getElementById("connect-btn");
            const connectionNote = document.getElementById("connection-note");
            const emptyState = document.getElementById("empty-state");
            let sessionId = null;

            document.getElementById("today-date").textContent = new Intl.DateTimeFormat("en-US", {
                weekday: "long", month: "long", day: "numeric", timeZone: "America/New_York",
            }).format(new Date());

            function setConnected() {
                connectBtn.textContent = "Google connected";
                connectBtn.classList.add("connected");
                connectionNote.textContent = "Calendar + Gmail connected";
            }

            connectBtn.addEventListener("click", function () {
                window.open("/auth/google", "daylight-google-auth", "popup,width=520,height=680");
            });

            window.addEventListener("message", function (event) {
                if (event.origin === window.location.origin && event.data === "daylight-google-connected") {
                    setConnected();
                }
            });

            fetch("/auth/status")
                .then((response) => response.json())
                .then((data) => {
                    if (data.connected) setConnected();
                })
                .catch(() => {});

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML = '<div class="role">' + role + '</div><div class="content"></div>';
                div.querySelector(".content").textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            function renderMarkdown(text) {
                const escapeHtml = (value) =>
                    value.replace(/[&<>"']/g, (char) => ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;",
                    })[char]);
                const inline = (value) =>
                    escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
                const blocks = text.trim().split(/\n\s*\n/);
                return blocks.map((block) => {
                    const lines = block.split("\n");
                    if (lines.every((line) => /^\s*[-*]\s+/.test(line))) {
                        return "<ul>" + lines.map((line) => "<li>" + inline(line.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
                    }
                    if (lines.every((line) => /^\s*\d+[.)]\s+/.test(line))) {
                        return "<ol>" + lines.map((line) => "<li>" + inline(line.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
                    }
                    return "<p>" + lines.map(inline).join("<br>") + "</p>";
                }).join("");
            }

            function formatToolResult(result) {
                try {
                    const data = typeof result === "string" ? JSON.parse(result) : result;
                    if (data.error) return data.error;
                    if (Array.isArray(data.events)) {
                        if (!data.events.length) return "No calendar events found.";
                        return data.events.map((event) =>
                            `${event.summary}: ${event.start || "all day"}${event.end ? " to " + event.end : ""}`
                        ).join("\n");
                    }
                    if (Array.isArray(data.messages)) {
                        if (!data.messages.length) return "No matching emails found.";
                        return data.messages.map((email) =>
                            `${email.subject || "(No subject)"} | ${email.date || ""}\n${email.snippet || ""}`
                        ).join("\n\n");
                    }
                    return JSON.stringify(data, null, 2);
                } catch {
                    return String(result);
                }
            }

            async function send(prompt) {
                const text = (prompt || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                userInput.value = "";
                sendBtn.disabled = true;
                emptyState.hidden = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const raw = await res.text();
                    if (!res.ok) {
                        let detail = raw.slice(0, 120) || "No details returned";
                        try { detail = JSON.parse(raw).detail || detail; } catch {}
                        throw new Error(`Server error (${res.status}): ${detail}`);
                    }
                    let data;
                    try { data = JSON.parse(raw); }
                    catch { throw new Error("The server returned an unreadable response. Please try again."); }
                    sessionId = data.session_id;

                    for (const call of data.tool_calls || []) {
                        const details = document.createElement("details");
                        details.className = "tool";
                        const summary = document.createElement("summary");
                        const name = document.createElement("strong");
                        name.textContent = call.name;
                        summary.append(name, document.createTextNode("  " + JSON.stringify(call.args)));
                        const result = document.createElement("pre");
                        result.textContent = formatToolResult(call.result);
                        details.append(summary, result);
                        messages.insertBefore(details, loading);
                    }
                    loading.querySelector(".content").innerHTML = renderMarkdown(
                        data.response || "I couldn't complete that answer. Please try again."
                    );
                } catch (e) {
                    loading.querySelector(".content").textContent = e.message;
                } finally {
                    loading.classList.remove("loading");
                    sendBtn.disabled = false;
                    messages.scrollTop = messages.scrollHeight;
                    userInput.focus();
                }
            }

            document.getElementById("input-area").addEventListener("submit", function (event) {
                event.preventDefault();
                send();
            });
            document.querySelectorAll(".quick-prompt").forEach((button) => {
                button.addEventListener("click", () => send(button.dataset.prompt));
            });
            userInput.focus();
        </script>
    </body>
</html>
